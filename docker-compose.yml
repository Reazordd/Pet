services:
  db:
    image: postgres:15-alpine
    container_name: pet_db
    environment:
      POSTGRES_USER: petuser
      POSTGRES_PASSWORD: petpassword
      POSTGRES_DB: petdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: pet_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pet_backend
    env_file:
      - ./backend/.env
    environment:
      # 🔥 Эти переменные нужны для создания суперпользователя
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin123
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    # 🔥 Используем entrypoint.sh
    entrypoint: ["/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pet_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: npm run dev

volumes:
  db_data: {}
  media_data: {}
  static_data: {}