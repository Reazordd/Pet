# docker-compose.prod.yml
version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: pet_db
    environment:
      POSTGRES_USER: petuser
      POSTGRES_PASSWORD: 5v1234567
      POSTGRES_DB: petdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - petnet

  redis:
    image: redis:7-alpine
    container_name: pet_redis
    networks:
      - petnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pet_backend
    env_file:
      - ./backend/.env.prod
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - petnet
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        gunicorn pet_project.asgi:application
        --worker-class uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:8000
        --workers 3
        --timeout 120
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pet_frontend
    networks:
      - petnet

  nginx:
    image: nginx:1.25-alpine
    container_name: pet_nginx
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    ports:
      - "80:80"
    networks:
      - petnet
    restart: always

volumes:
  db_data:
  media_data:
  static_data:

networks:
  petnet:
    driver: bridge