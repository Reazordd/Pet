# filebeat/filebeat.yml (simplified for local dev)
filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata: ~
      - add_host_metadata: ~

output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}"]
  # In dev mode we disable security; in prod — configure auth certs
setup.kibana:
  host: "http://kibana:5601"
